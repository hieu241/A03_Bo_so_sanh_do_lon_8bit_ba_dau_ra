project:
  title: "A03 - 8-Bit Unsigned Magnitude Comparator"
  author: "A03 Design Team"
  discord: ""
  description: "8-bit unsigned magnitude comparator with 3 one-hot outputs (GT, EQ, LT)"
  language: "Verilog"

pinout:
  ui[0]: "A[0]"
  ui[1]: "A[1]"
  ui[2]: "A[2]"
  ui[3]: "A[3]"
  ui[4]: "A[4]"
  ui[5]: "A[5]"
  ui[6]: "A[6]"
  ui[7]: "A[7]"

  uo[0]: "a_gt_b"
  uo[1]: "a_eq_b"
  uo[2]: "a_lt_b"
  uo[3]: "unused"
  uo[4]: "unused"
  uo[5]: "unused"
  uo[6]: "unused"
  uo[7]: "unused"

  uio[0]: "B[0]"
  uio[1]: "B[1]"
  uio[2]: "B[2]"
  uio[3]: "B[3]"
  uio[4]: "B[4]"
  uio[5]: "B[5]"
  uio[6]: "B[6]"
  uio[7]: "B[7]"
